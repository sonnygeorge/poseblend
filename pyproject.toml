[project]
name = "poseblend"
version = "0.1.0"
description = "PoseBlend: Generating Compositional Action Scenes via Critic-Gated Localized Editing of Blender Renders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bpy>=5.0.1",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.6",
    "openai>=1.0.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
    "mathutils>=3.3.0",
    "torch>=2.10.0",
    "diffusers>=0.36.0",
    "huggingface-hub>=1.4.1",
    "transformers>=5.1.0",
    "fal-client>=0.13.0",
    "loguru>=0.7.3",
    "aiohttp>=3.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "ALL",
    # rules to include even if a parent is listed as ignored:
    "W605", "D419", "G010", "G101", "G2", "RET502", "RET503",
]
extend-ignore = [
    # explicit conflicts with auto-formatter:
    "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003", "COM812", "COM819", "E501",
    # whitespace and formatting taken care of by pre-commit:
    "W",
    # comments are always fine:
    "TD", "FIX", "ERA",
    # don't care:
    "C90", "D", "DOC", "ANN002", "ANN003", "ANN401", "S104", "S113", "S311", "FBT",
    "B904", "B905", "CPY", "C408", "EM", "G", "RSE", "RET", "TC", "PTH123", "PLR0133",
    "PLR09", "PLR1711", "PLR2004", "TRY003", "TRY301",
    # actually makes code harder to read:
    "UP015", "PT003", "SIM105", "SIM108",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true
suppress-dummy-args = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
