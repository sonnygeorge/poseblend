[project]
name = "poseblend"
version = "0.1.0"
description = "PoseBlend: Generating Compositional Action Scenes via Critic-Gated Localized Editing of Blender Renders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bpy>=5.0.1",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.6",
    "openai>=1.0.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
    "mathutils>=3.3.0",
    "torch>=2.10.0",
    "diffusers>=0.36.0",
    "huggingface-hub>=1.4.1",
    "transformers>=5.1.0",
    "fal-client>=0.13.0",
    "loguru>=0.7.3",
]
