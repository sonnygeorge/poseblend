scene_as_natural_language: A ball kicks an athlete toward the goal.
action: kicks toward
role_assignments:
  kicker: ball
  kicked: athlete
  toward: goal
aliases:
  athlete: "human athlete in a yellow jersey"
  ball: "soccer ball"
  goal: "soccer goal"
scale_amounts:
  ball: 1.9
localized_edits:
  - region_contains:
      - kicked
    requirements:
      - "{kicked} is directly in between {kicker} and {toward}"
  - region_contains:
      - toward
    requirements:
      - "The opening of {toward} is facing towards {kicked}"
  - region_contains:
      - kicker
    requirements:
      - "{kicker} is actually a cute cartoon-y character with a face, long legs, and soccer cleats"
  - region_contains:
      - kicker
    requirements:
      - "One of {kicker}'s two legs is extended out towards {kicked} as if it had just kicked them in the direction of {toward}"
      - "{kicker} is looking at {kicked}"
  - region_contains:
      - kicked
    requirements:
      - "{kicked} is airborne"
      - "{kicked} is in a superman-like flying pose with their head and arms pointed toward {toward}"
  - region_contains:
      - kicker
      - kicked
    requirements:
      - "A dotted line extends from {kicker}'s foot to {kicked}, indicating that {kicked}'s flight is coming off from {kicker}'s foot"
final_requirements:
  # - "{kicked} seems to be flying on a path from {kicker} towards {toward}. There are motion trails extending back from {kicked} towards {kicker}/{kicker}'s foot."
  - "It appears as that though {kicked}'s flight path originated from {kicker}'s foot"
  - "{kicked} is head towards {toward}"
