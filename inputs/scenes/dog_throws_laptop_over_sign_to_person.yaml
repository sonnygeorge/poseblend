scene_as_natural_language: A dog throws a laptop over a sign to a person.
action: throws
role_assignments:
  thrower: dog
  thrown: laptop
  thrown_to: person
  thrown_over: sign
localized_edits:
  - region_contains:
      - thrown_over
    requirements:
      - "{thrown_over} is directly in between {thrower} and {thrown_to}"
  - region_contains:
      - thrown
    requirements:
      - "in terms of the scene itself (not necessarily the rendered image), {thrown} is airborne above {thrown_over}"
      - "Wind-mark motion trails that are small, subtle, and short (in length) trail behind {thrown}, pointing back towards {thrower} and indicating the immediate, lastmost portion of airspace that {thrown} has passed through on a flight traveling away from {thrower}"
  - region_contains:
      - thrower
    requirements:
      - "it looks like {thrower} just released/threw {thrown}—that is, the {thrower}'s pose is a throwing follow-through with at least one arm outstretched towards {thrown}"
  - region_contains:
      - thrown_to
    requirements:
      - "{thrown_to}'s gaze is looking up at {thrown} with both arms outstretched as if lining up to catch it"
final_requirements:
  - "{thrown} seems to be flying from {thrower} to {thrown_to}, and there are not motion trails that seem to contradict this"
