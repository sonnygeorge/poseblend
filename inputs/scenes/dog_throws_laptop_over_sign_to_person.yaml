scene_as_natural_language: A dog throws a laptop over a sign to a person.
action: throws
role_assignments:
  thrower: dog
  thrown: laptop
  thrown_to: person
  thrown_over: sign
localized_edits:
  - region_contains:
      - thrown_over
    requirements:
      - "{thrown_over} is directly in between {thrower} and {thrown_to}"
  - region_contains:
      - thrown
    requirements:
      - "in terms of the scene itself (not necessarily the rendered image), {thrown} is airborne above {thrown_over}"
      - "Short wind-mark motion trails extend back from {thrown} down in the direction of {thrower}, indicating the lastmost chunk (inches?) of airspace that {thrown} has flown through"
  - region_contains:
      - thrower
    requirements:
      - "the {thrower}'s pose corroborates that they just threw {thrown}—that is, the {thrower}'s pose is more or less a throwing follow-through with at least one arm extended out towards {thrown}"
  - region_contains:
      - thrown_to
    requirements:
      - "{thrown_to}'s gaze is looking up at {thrown} with both arms outstretched as if lining up to catch it"
final_requirements:
  - "{thrown} seems to be flying from {thrower} to {thrown_to}, and there are not motion trails that seem to contradict this"
