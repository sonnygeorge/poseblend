      - "{thrower} is a character with lengthy capable limbs"
      - "{thrower} character's body is rotated to be facing {thrown}"
  - region_contains:
      - thrower
    requirements:
      - "{thrower} character is in what appears to be a throwing follow-through pose with one foot slightly raised and one of its arms extended towards {thrown}"
