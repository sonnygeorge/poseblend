num_blender_scenes: 2
num_renders: 3
num_edit_chains: 2
min_render_quality_score: 0.6
max_edit_attempts: 3
max_concurrent_inference_requests: 5
max_concurrent_blender_processes: 2
base_scene_path: "inputs/objaverse/base_scene.blend"
objects_dir_path: "inputs/objaverse/shapes"
output_dir_path: "outputs"
render_resolution_x: 512
render_resolution_y: 512
camera_fov_degrees: 60
blender_lm: "gpt-5.2-2025-12-11"
blender_lm_temperature: 1.0
critic_vlm: "gpt-5.2-2025-12-11"
critic_vlm_temperature: 0.3
seed: 42
edit_model_selection_schedule:
  - from_attempt: 1
    to_attempt: null
    model_probs:
      "fal-ai/gemini-25-flash-image/edit": 1.0
background_strs:
  - "sandy background"
  - "grassy background"
  - "snowy background"
