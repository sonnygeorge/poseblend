num_blender_scenes: 4
num_renders: 8
num_edit_chains: 6
min_render_quality_score: 0.6
max_edit_attempts: 3
max_concurrent_inference_requests: 10
max_concurrent_blender_processes: 4
base_scene_path: "inputs/objaverse/base_scene.blend"
objects_dir_path: "inputs/objaverse/shapes"
output_dir_path: "outputs"
render_resolution_x: 512
render_resolution_y: 512
camera_fov_degrees: 60
blender_lm: "gpt-5.2-2025-12-11"
blender_lm_temperature: 1.0
critic_vlm: "gpt-5.2-2025-12-11"
critic_vlm_temperature: 0.8
seed: 42
edit_model_selection_schedule:
  - from_attempt: 1
    to_attempt: 2
    model_probs:
      "fal-ai/hunyuan-image/v3/instruct/edit": 0.27
      "fal-ai/gpt-image-1.5/edit": 0.11
      "fal-ai/gemini-25-flash-image/edit": 0.4
      "xai/grok-imagine-image/edit": 0.22
  - from_attempt: 3
    to_attempt: null
    model_probs:
      "fal-ai/nano-banana/edit": 0.4
      "xai/grok-imagine-image/edit": 0.2
      "fal-ai/hunyuan-image/v3/instruct/edit": 0.2
      "fal-ai/gemini-25-flash-image/edit": 0.2
background_strs:
  - "sandy background"
  - "visually minimal empty green landscape background"
  - "grassy background"
  - "empty open industrial space background"
  - "snowy background"
  - "plain grassy field background"
  - "empty cracked dry lake bed background"
  - "empty tundra background"
  - "open empty landscape background"
  - "empty hangar background"
  - "empty city park background"
  - "empty indoor tiled space background"
  - "empty parking lot background"
  - "empty gravelled area background"
  - "empty industrial space with concrete floor background"
  - "plain grassy background"
  - "visually minimal empty warehouse background"
  - "empty indoor brick floor space background"
  - "visually minimal flat arid desert background"
  - "empty commercial office space background"
  - "empty minimal skate park background"
